; Site configuration applied by "reconfigure" (node reconfigure).
; See README.md, section "Customizing the NOS 2.8.7 Configuration".

[EQPDECK]
; EST 23 and 24 (octal) are the CYBIS auxiliary packs PUB0 and PUB1, which
; ship with ~37 free tracks. Set their low-space threshold to 0 so they stop
; raising "14 LOW SPACE ON MASS STORAGE DEVICE" on the A,OPERATOR display.
; (NOS 2 Analysis Handbook, EQPDECK THRESHOLD entry, page 3-98.)
THRESHOLD,LS=0,23,24.
